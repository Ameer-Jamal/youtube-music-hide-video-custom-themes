name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for integration checks
        run: npx playwright install --with-deps chromium

      - name: Light theme component contrast regression
        run: npm run test:light

      - name: Home gradient pixel regression
        run: npm run test:home

      - name: Browser integration checks
        run: npm run test:browser

      - name: Check
        run: npm run check

      - name: Package extension
        run: npm run zip

      - name: Installed extension smoke test
        run: node scripts/extension-smoke.mjs

      # Upload the unpacked package, not dist/*.zip — artifact downloads are
      # always re-zipped, so uploading a .zip would nest chatgpt-material-dark-customizer-v*.zip
      # inside Extension-Package.zip.
      - name: Upload extension package
        uses: actions/upload-artifact@v6
        with:
          name: Extension-Package
          path: dist/extension/
          if-no-files-found: error
          retention-days: 5
